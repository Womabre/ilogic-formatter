# Type-checks, tests and packages the extension on every push and pull request.
# The .vsix is attached to the run as an artifact.
# Actions are pinned to a commit; the comment after each gives its version.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run compile
      - run: bun test
      - name: Package
        run: bunx --no-install vsce package --out ilogic-formatter.vsix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ilogic-formatter-vsix
          path: ilogic-formatter.vsix
