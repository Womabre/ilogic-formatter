# Release on a version tag (v1.2.3): test, package, create a GitHub release
# with the .vsix attached, and publish:
# - VS Code Marketplace: when the repository secret VSCE_PAT is set.
# - Open VSX: by trusted publishing (no token; GitHub's OIDC identity), when the
#   repository variable PUBLISH_OPENVSX is "true". Configure this repository and
#   workflow file as a trusted publisher on open-vsx.org first (RELEASING.md).
# Skipped publish steps leave the GitHub release in place, so tagging is safe.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # create the GitHub release
  id-token: write   # OIDC token for Open VSX trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Tag matches package.json version
        run: |
          version=$(bun -e 'console.log(require("./package.json").version)')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          echo "VSIX=ilogic-formatter-$version.vsix" >> "$GITHUB_ENV"
      - run: bun install
      - run: bun run compile
      - run: bun test
      - name: Package
        run: bunx vsce package --out "$VSIX"
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.VSIX }}
          body: See CHANGELOG.md for what changed.
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: bunx vsce publish --packagePath "$VSIX" --pat "$VSCE_PAT"
      - name: Publish to Open VSX (trusted publishing)
        if: vars.PUBLISH_OPENVSX == 'true'
        run: bunx ovsx@1.2.0 publish "$VSIX" --trusted-publishing
