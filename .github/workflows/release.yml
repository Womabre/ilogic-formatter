# Release on a version tag (v1.2.3): test, package, create a GitHub release
# with the .vsix attached, and publish it to Open VSX and the VS Code
# Marketplace by trusted publishing (no tokens: GitHub's OIDC identity,
# registered for this repository and this workflow file on open-vsx.org and on
# the Marketplace publisher page). See RELEASING.md.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # create the GitHub release
  id-token: write   # OIDC token for Open VSX and Marketplace trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Tag matches package.json version
        run: |
          version=$(bun -e 'console.log(require("./package.json").version)')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          echo "VSIX=ilogic-formatter-$version.vsix" >> "$GITHUB_ENV"
      - run: bun install
      - run: bun run compile
      - run: bun test
      - name: Package
        run: bunx vsce package --out "$VSIX"
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.VSIX }}
          body: See CHANGELOG.md for what changed.
      - name: Publish to Open VSX (trusted publishing)
        run: bunx ovsx@1.2.0 publish "$VSIX" --trusted-publishing
      - name: Publish to VS Code Marketplace (trusted publishing)
        run: bunx @vscode/vsce@4.1.0 publish --packagePath "$VSIX" --oidc
